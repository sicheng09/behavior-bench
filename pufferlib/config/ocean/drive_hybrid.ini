[base]
package = ocean
env_name = puffer_drive_hybrid
policy_name = HybridDriveOriginal
rnn_name = Recurrent

[vec]
num_workers = 16
num_envs = 16
batch_size = 4

[policy]
input_size = 16
hidden_size = 80

[rnn]
input_size = 80
hidden_size = 80

[env]
num_agents = 1024
action_type = discrete
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
reward_speed_limit = 0.0
reward_lane_alignment = 0.0
reward_lane_distance = 0.0
reward_velocity = 0.0
reward_comfort = 0.0
reward_l_align = 0.0
reward_l_align_vel = 0.5
reward_l_center = 0.0
reward_timestep = 0.0
dt = 0.1
collision_shrink = 0.7
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 3
goal_target_distance = 30.0
collision_behavior = 2
offroad_behavior = 2
episode_length = 91
resample_frequency = 910
split = training
termination_mode = 1
num_maps = 79000
init_steps = 0
control_mode = control_vehicles
init_mode = create_all_valid
idm_others = False
max_controlled_agents = -1
max_obs_partners = 31
mix_traffic = False
ppo_fraction = 1.0
idm_fraction = 0.0
expert_fraction = 0.0
idm_target_velocity = 15.0
idm_random_velocity = False

[train]
seed = 42
total_timesteps = 2_000_000_000
anneal_lr = True
batch_size = 524288
minibatch_size = 32768
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.85
prio_beta0 = 0.85
update_epochs = 1
vf_clip_coef = 0.2
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
teacher_only = False
teacher_bc_kl_coef = 0.01
bc_weights_path =
kl_coef = 0.1
smart_ref_weights_path =
smart_ref_shift = 5
humanlike_coef = 0.1
opponent_pool = False
opponent_pool_fraction = 0.25
opponent_pool_snapshot_interval = 100
opponent_pool_max_snapshots = 20
opponent_pool_warmup_epochs = 100
mix_ppo = True
mix_ppo_policy_mix = original:0.7,low:0.1,mid:0.1,high:0.1
mix_ppo_policy_names = HybridDriveOriginal,HybridDriveLiteLow,HybridDriveMid,HybridDriveMoE3High
mix_ppo_rnn_names = Recurrent,None,Recurrent,Recurrent
mix_ppo_rnn_input_sizes = 80,80,80,80
mix_ppo_rnn_hidden_sizes = 80,80,80,80
mix_ppo_policy_paths = ,,,
mix_ppo_policy_trainable = True,False,False,False
mix_ppo_sampling = stratified
mix_ppo_policy_minibatch_sizes = 32768,0,0,0
mix_ppo_policy_update_steps = 0,0,0,0
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

[eval]
eval_interval = 1000
split = training
num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = control_wosac
wosac_init_mode = create_all_valid
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = control_sdc_only
